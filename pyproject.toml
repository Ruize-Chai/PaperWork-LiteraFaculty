[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwork-literafaculty"
version = "0.1.0"
description = "A traceable, deterministic MVP for compiling research evidence into manuscripts."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paper = "paper_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["paper_pipeline*"]

